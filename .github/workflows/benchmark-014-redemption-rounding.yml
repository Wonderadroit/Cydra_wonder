name: benchmark-014-redemption-rounding
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -e . pytest
      - run: pytest -q tests/test_redemption_rounding.py
      - run: PYTHONPATH=src python scripts/run_benchmark_014_redemption_rounding.py
