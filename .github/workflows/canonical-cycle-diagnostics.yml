name: CYDRA Canonical Cycle Diagnostics

on:
  push:
    branches: [migrate-system-model-adapters]
  pull_request:
    branches: [main]

jobs:
  canonical-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CYDRA and pytest
        run: python -m pip install -e . pytest
      - name: Focused canonical-cycle tests
        run: pytest -q tests/test_canonical_cycle.py tests/test_finding_gate_migration.py --tb=short | tee canonical-cycle.log; test ${PIPESTATUS[0]} -eq 0
      - name: Compile changed reasoning modules
        if: always()
        run: python -m py_compile src/cydra/canonical_cycle.py src/cydra/causal_verification.py src/cydra/finding_gate.py src/cydra/hypotheses.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cycle-diagnostics
          path: canonical-cycle.log
