name: CYDRA Benchmark 040 — Post-Maturity Unfamiliar-Target Batch

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_benchmark_blind.py"
      - "scripts/run_benchmark_040_post_maturity_batch.py"
      - "benchmarks/040_post_maturity_batch/**"
      - ".github/workflows/benchmark-040-post-maturity-batch.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_benchmark_blind.py"
      - "scripts/run_benchmark_040_post_maturity_batch.py"
      - "benchmarks/040_post_maturity_batch/**"
      - ".github/workflows/benchmark-040-post-maturity-batch.yml"

permissions:
  contents: read

jobs:
  batch:
    name: post-maturity batch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Full regression baseline
        run: python -m pytest -q
      - name: Run post-maturity batch
        env:
          PYTHONPATH: .
        run: |
          set +e
          python scripts/run_benchmark_040_post_maturity_batch.py
          rc=$?
          printf '{"campaign":"040","exit_code":%s}\n' "$rc" > backtest-artifacts/benchmark-040/ci-result.json
          exit "$rc"
      - name: Run Benchmark 041 blind-to-causal discovery
        env:
          PYTHONPATH: .
        run: |
          set +e
          python scripts/run_benchmark_041_post_maturity_causal_discovery.py
          rc=$?
          printf '{"campaign":"041","exit_code":%s}\n' "$rc" > backtest-artifacts/benchmark-041/ci-result.json
          exit "$rc"
      - name: Upload Benchmark 041 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-041-post-maturity-causal-discovery
          path: backtest-artifacts/benchmark-041
          if-no-files-found: error
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-040-post-maturity-batch
          path: backtest-artifacts/benchmark-040
          if-no-files-found: error
