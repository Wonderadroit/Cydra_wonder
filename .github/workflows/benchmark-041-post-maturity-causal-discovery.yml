name: CYDRA Benchmark 041 — Post-Maturity Blind-to-Causal Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_benchmark_blind.py"
      - "scripts/run_benchmark_041_post_maturity_causal_discovery.py"
      - "benchmarks/041_post_maturity_causal_discovery/**"
      - ".github/workflows/benchmark-041-post-maturity-causal-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Full regression
        run: python -m pytest -q
      - name: Blind-to-causal campaign
        env:
          PYTHONPATH: .
        run: |
          set +e
          python scripts/run_benchmark_041_post_maturity_causal_discovery.py
          rc=$?
          printf '{"campaign":"041","exit_code":%s}\n' "$rc" > backtest-artifacts/benchmark-041/ci-result.json
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-041-post-maturity-causal-discovery
          path: backtest-artifacts/benchmark-041
          if-no-files-found: error
