name: CYDRA Benchmark 012 Read-Only Reentrancy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  read-only-reentrancy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_read_only_reentrancy.py
      - run: PYTHONPATH=src python scripts/run_benchmark_012_read_only_reentrancy.py
