name: CYDRA AST dataflow projection regression

on:
  pull_request:
    paths:
      - "src/cydra/ast_dataflow.py"
      - "src/cydra/system_model.py"
      - "tests/test_ast_dataflow_semantics.py"
      - "tests/test_system_model_ast_projection.py"
      - "src/cydra/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  semantic-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_ast_dataflow_semantics.py tests/test_system_model_ast_projection.py

  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q
