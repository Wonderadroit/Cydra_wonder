name: CYDRA Benchmark 011 - Idempotency

on:
  push:
    branches: [main]
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_011_idempotency.py"
      - "benchmarks/011_idempotency_mt_pelerin/**"
      - "tests/test_idempotency.py"
      - ".github/workflows/benchmark-011-idempotency.yml"
  pull_request:
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_011_idempotency.py"
      - "benchmarks/011_idempotency_mt_pelerin/**"
      - "tests/test_idempotency.py"
      - ".github/workflows/benchmark-011-idempotency.yml"
  workflow_dispatch:

jobs:
  idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_idempotency.py
      - run: PYTHONPATH=src python scripts/run_benchmark_011_idempotency.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-011-idempotency-diagnostics
          path: artifacts/
