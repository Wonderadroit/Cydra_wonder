name: CYDRA Benchmark 011 - Idempotency

on:
  workflow_dispatch:


jobs:
  idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_idempotency.py
      - run: PYTHONPATH=src python scripts/run_benchmark_011_idempotency.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-011-idempotency-diagnostics
          path: artifacts/
