name: CYDRA open-ended blind Solidity discovery

on:
  push:
    branches: [main]
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_022_open_ended_blind.py"
      - "benchmarks/022_open_ended_blind/**"
      - "tests/test_structural_signed_metadata.py"
      - "tests/test_hypothesis_selection.py"
      - ".github/workflows/benchmark-022-open-ended-blind.yml"
  pull_request:
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_022_open_ended_blind.py"
      - "benchmarks/022_open_ended_blind/**"
      - "tests/test_structural_signed_metadata.py"
      - "tests/test_hypothesis_selection.py"
      - ".github/workflows/benchmark-022-open-ended-blind.yml"
  workflow_dispatch:

jobs:
  open-ended-blind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_structural_signed_metadata.py tests/test_hypothesis_selection.py
      - run: PYTHONPATH=src python scripts/run_benchmark_022_open_ended_blind.py --output backtest-artifacts/open-ended-blind
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-022-open-ended-blind
          path: backtest-artifacts/open-ended-blind/

