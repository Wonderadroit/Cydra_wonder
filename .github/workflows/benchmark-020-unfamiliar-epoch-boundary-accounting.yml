name: CYDRA unfamiliar epoch-boundary accounting backtest

on:
  workflow_dispatch:


jobs:
  epoch-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_structural_epoch_accounting.py
      - run: PYTHONPATH=src python scripts/run_benchmark_020_unfamiliar_epoch_boundary.py --output backtest-artifacts/epoch-boundary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-020-epoch-boundary
          path: backtest-artifacts/epoch-boundary/
