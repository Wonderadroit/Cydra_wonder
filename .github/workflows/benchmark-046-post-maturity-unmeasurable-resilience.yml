name: CYDRA Benchmark 046 — Post-Maturity Unmeasurable Resilience

on:
  workflow_dispatch:

permissions:

jobs:
  unmeasurable-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Research-loop regression
        run: python -m pytest -q tests/test_research_loop.py tests/test_impact_priority.py
      - name: Unmeasurable-resilience campaign
        run: PYTHONPATH=src python scripts/run_benchmark_046_unmeasurable_resilience.py
