name: CYDRA Benchmark 001

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        working-directory: benchmarks/alchemix_missing_access_control/foundry
        run: forge install foundry-rs/forge-std --no-commit
      - name: Install CYDRA and pytest
        run: python -m pip install -e . pytest
      - name: Python acceptance suite
        run: pytest -q --tb=short | tee pytest.log; test ${PIPESTATUS[0]} -eq 0
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-001-pytest-diagnostics
          path: pytest.log
      - name: Execute hypothesis with negative control
        env:
          PYTHONPATH: src
        run: python scripts/run_benchmark_001.py
