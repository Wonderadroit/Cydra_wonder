name: Aurory fix regression

on:
  push:
    branches:
      - fix/aurory-bugcrowd-auth

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pytest tests/test_web2_resource_state_acquisition.py tests/test_web2_service_origin_readiness.py
