name: Benchmark 030 strict blind type-domain

on:
  pull_request:
    paths:
      - "src/cydra/**"
      - "tests/test_structural_type_domain.py"
      - "scripts/run_benchmark_030_strict_blind_type_domain.py"
      - "benchmarks/030_type_domain/**"
      - ".github/workflows/benchmark-030-strict-blind-type-domain.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-030:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Python dependencies
        run: pip install -e .
      - name: Run structural regression
        run: pytest -q tests/test_structural_type_domain.py
      - name: Run strict blind campaign
        run: python scripts/run_benchmark_030_strict_blind_type_domain.py
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-030-strict-blind-type-domain
          path: backtest-artifacts/strict-blind-type-domain/
