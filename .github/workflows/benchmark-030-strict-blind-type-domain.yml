name: Benchmark 030 strict blind type-domain

on:
  workflow_dispatch:

permissions:

jobs:
  benchmark-030:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Python dependencies
        run: pip install -e . pytest
      - name: Run structural regression
        run: pytest -q tests/test_structural_type_domain.py
      - name: Run strict blind campaign
        run: python scripts/run_benchmark_030_strict_blind_type_domain.py
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-030-strict-blind-type-domain
          path: backtest-artifacts/strict-blind-type-domain/
