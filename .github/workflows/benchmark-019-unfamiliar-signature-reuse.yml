name: CYDRA unfamiliar signature reuse backtest

on:
  push:
    branches: [main]
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_019_unfamiliar_signature_reuse.py"
      - "benchmarks/019_signature_reuse/**"
      - "tests/test_structural_signature_reuse.py"
      - ".github/workflows/benchmark-019-unfamiliar-signature-reuse.yml"
  pull_request:
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_019_unfamiliar_signature_reuse.py"
      - "benchmarks/019_signature_reuse/**"
      - "tests/test_structural_signature_reuse.py"
      - ".github/workflows/benchmark-019-unfamiliar-signature-reuse.yml"
  workflow_dispatch:

jobs:
  signature-reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_structural_signature_reuse.py
      - run: PYTHONPATH=src python scripts/run_benchmark_019_unfamiliar_signature_reuse.py --output backtest-artifacts/signature-reuse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-019-signature-reuse
          path: backtest-artifacts/signature-reuse/
