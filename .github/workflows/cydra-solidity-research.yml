name: CYDRA Solidity research loop

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "benchmarks/**"
      - "PROJECT_BIBLE.md"
      - ".github/workflows/cydra-solidity-research.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: cydra-solidity-research
  cancel-in-progress: false

jobs:
  regression-and-historical-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install CYDRA and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Run full Python regression suite
        run: python -m pytest -q

      - name: Run verified unfamiliar-target historical backtest
        env:
          PYTHONPATH: src
        run: python scripts/run_benchmark_016_olympus_cross_contract_attribution.py

      - name: Run unfamiliar historical initializer backtest
        env:
          PYTHONPATH: src
        run: |
          mkdir -p backtest-artifacts/stader-initialization
          python scripts/run_benchmark_005_blind.py \
            --target-repo https://github.com/code-423n4/2023-06-stader.git \
            --target-ref 7566b5a35f32ebd55d3578b8bd05c038feb7d9cc \
            --target-path contracts/VaultProxy.sol \
            --target-project . \
            --classes initialization \
            --freeze backtest-artifacts/stader-initialization/freeze

      - name: Run unfamiliar Olas transfer-accounting backtest
        env:
          PYTHONPATH: src
        run: |
          mkdir -p backtest-artifacts/olas-transfer-accounting
          python scripts/run_benchmark_017_olas_unfamiliar_transfer_accounting.py             --output backtest-artifacts/olas-transfer-accounting

      - name: Run unfamiliar Morph L2 implementation-initialization backtest
        env:
          PYTHONPATH: src
        run: |
          mkdir -p backtest-artifacts/morph-initialization
          python scripts/run_benchmark_005_blind.py             --target-repo https://github.com/morph-l2/morph.git             --target-ref aa35ed6d1d0bb1e0a38f04dcfb9c5b3203f90604             --target-path contracts/contracts/l2/staking/L2Staking.sol             --target-project contracts             --classes initialization             --freeze backtest-artifacts/morph-initialization/freeze

      - name: Publish research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-solidity-research-${{ github.sha }}
          path: backtest-artifacts/
          if-no-files-found: ignore
          retention-days: 30
