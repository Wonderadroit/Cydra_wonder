name: CYDRA open-ended guard discovery

on:
  push:
    branches: [main]
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_023_open_ended_guard.py"
      - "benchmarks/023_open_ended_guard/**"
      - ".github/workflows/benchmark-023-open-ended-guard.yml"
  pull_request:
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_023_open_ended_guard.py"
      - "benchmarks/023_open_ended_guard/**"
      - ".github/workflows/benchmark-023-open-ended-guard.yml"
  workflow_dispatch:

jobs:
  open-ended-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python scripts/run_benchmark_023_open_ended_guard.py --output backtest-artifacts/open-ended-guard
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-023-open-ended-guard
          path: backtest-artifacts/open-ended-guard/

# No vulnerability-class guidance is supplied to investigate().
