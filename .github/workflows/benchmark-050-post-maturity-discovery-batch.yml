name: CYDRA post-maturity discovery batch campaign

on:
  workflow_dispatch:

permissions:

jobs:
  discovery-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Focused regression
        run: python -m pytest -q tests/test_research_loop.py tests/test_impact_priority.py
      - name: Post-maturity discovery batch
        run: PYTHONPATH=src python scripts/run_benchmark_050_post_maturity_discovery_batch.py
