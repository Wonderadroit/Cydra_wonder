name: benchmark-048-post-maturity-research-loop-duplicate-integration

on:
  pull_request:
    paths:
      - "src/cydra/impact_priority.py"
      - "src/cydra/research_loop.py"
      - "tests/test_research_loop.py"
      - "scripts/run_benchmark_048_research_loop_duplicate_integration.py"
      - "benchmarks/048_post_maturity_research_loop_duplicate_integration/**"
      - ".github/workflows/benchmark-048-post-maturity-research-loop-duplicate-integration.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_benchmark_048_research_loop_duplicate_integration.py
      - run: python -m pytest -q tests/test_research_loop.py
