name: Benchmark 032 strict blind callback state order
# Canonical validation trigger: execute this workflow on the validation PR.

on:
  workflow_dispatch:

permissions:

jobs:
  benchmark-032:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
      - name: Install Python dependencies
        run: pip install -e . pytest
      - name: Run structural regression
        run: pytest -q tests/test_structural_callback_state_order.py
      - name: Run strict blind campaign
        run: python scripts/run_benchmark_032_strict_blind_callback_state_order.py
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-032-strict-blind-callback-state-order
          path: backtest-artifacts/strict-blind-callback-state-order/
