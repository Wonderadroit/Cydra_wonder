name: CYDRA Web2 authenticated session regression

on:
  push:
    branches:
      - dogfood/web2-authenticated-session-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-session:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CYDRA
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CYDRA
        run: python -m pip install -e .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile Web2 modules
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/cydra

      - name: Run authenticated session regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_web2_session.py tests/test_web2_adapter.py
