name: CYDRA Benchmark 005 — Gavel blind canonical

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/run_benchmark_005_blind.py'
      - 'benchmarks/005_gavel_blind_discovery/**'
      - '.github/workflows/benchmark-005-gavel-blind-canonical.yml'
  workflow_dispatch:

# Only the latest commit is meaningful for this frozen blind benchmark.
# State surface is included as a diagnostic execution-only experiment.
# Prevent superseded matrix runs from accumulating in the queue.
concurrency:
  group: benchmark-005-gavel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  blind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_path:
          - contracts/LoanProtocol.sol
          - contracts/PositionNFT.sol
          - contracts/ListingService.sol
          - contracts/NFTLoanProtocol.sol
          - contracts/NFTPositionNFT.sol
          - contracts/NFTListingService.sol
    steps:
      - name: Check out CYDRA
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install CYDRA
        run: python -m pip install -e .

      - name: Install pytest
        run: python -m pip install pytest

      - name: Test initialization topology regressions
        run: python -m pytest -q tests/test_initialization_runtime.py tests/test_initialization_topology.py

      - name: Run blind canonical capability
        env:
          PYTHONPATH: src
        run: |
          mkdir -p blind-artifacts
          python scripts/run_benchmark_005_blind.py \
            --target-repo https://github.com/JamieFrame/The-Gavel-Protocol.git \
            --target-ref bfb5086eb7915d2dc90f52fd761d54bc2806847d \
            --target-path '${{ matrix.target_path }}' \
            --target-project . \
            --classes initialization authorization arithmetic state \
            --freeze "blind-artifacts/${{ matrix.target_path }}"

      - name: Print blind class coverage
        run: |
          echo "=== CYDRA blind class coverage: ${{ matrix.target_path }} ==="
          find blind-artifacts -name classification.json -print -exec cat {} \;

      - name: Compute artifact name
        id: artifact
        env:
          TARGET_PATH: ${{ matrix.target_path }}
        run: |
          name="${TARGET_PATH##*/}"
          name="${name%.sol}"
          echo "name=benchmark-005-${name}" >> "$GITHUB_OUTPUT"

      - name: Upload frozen blind artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: blind-artifacts/
