name: CYDRA Core Validation

on:
  push:
    branches:
      - fix/bounded-foundry-experiments
      - ci-validation
  workflow_dispatch:

concurrency:
  group: cydra-core-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install CYDRA and pytest
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Core regression
        run: python -m pytest -q tests/test_foundry_experiment.py
