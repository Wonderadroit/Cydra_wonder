name: CYDRA Benchmark 045 — Post-Maturity Search Exhaustion

on:
  workflow_dispatch:

permissions: {}

jobs:
  search-exhaustion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Research-loop regression
        run: python -m pytest -q tests/test_research_loop.py
      - name: Search-exhaustion campaign
        run: PYTHONPATH=src python scripts/run_benchmark_045_search_exhaustion.py
