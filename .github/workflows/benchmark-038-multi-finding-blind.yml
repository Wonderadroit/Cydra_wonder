name: Benchmark 038 strict blind multi-finding

on:
  workflow_dispatch:


jobs:
  benchmark-038:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Structural regression
        run: python -m pytest -q tests/test_research_loop.py tests/test_impact_priority.py
      - name: Strict blind two-finding campaign
        run: python scripts/run_benchmark_038_multi_finding_blind.py --output backtest-artifacts/benchmark-038
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-038-multi-finding-blind
          path: backtest-artifacts/benchmark-038
          if-no-files-found: error
