name: CYDRA Web2 adapter regression

on:
  push:
    branches:
      - feature/web2-adapter
  workflow_dispatch:

jobs:
  web2-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CYDRA
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CYDRA
        run: python -m pip install -e .
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Web2 adapter and model regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_web2_adapter.py tests/test_adapter_experiment.py tests/test_web2_model.py tests/test_web2_authorization.py tests/test_web2_evidence.py tests/test_web2_cycle.py tests/test_web2_causal.py tests/test_web2_reasoning.py tests/test_web2_replay.py
