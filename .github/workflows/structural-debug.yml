name: CYDRA structural debug

on:
  pull_request:
    paths:
      - "src/cydra/**"
      - "tests/test_structural_*.py"
      - "tests/test_ast_dataflow.py"
      - ".github/workflows/structural-debug.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - name: Run structural tests
        run: |
          set +e
          python -m pytest -vv tests/test_structural_arithmetic.py tests/test_structural_authorization.py tests/test_structural_initialization.py tests/test_structural_state.py tests/test_ast_dataflow.py 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit=$status" >> pytest.log
          exit $status
      - name: Upload structural debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-pytest-log
          path: pytest.log
