name: benchmark-008-graph-rounding

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install CYDRA
        run: python -m pip install -e . pytest
      - name: Python rounding regression
        run: pytest -q tests/test_structural_rounding.py
      - name: Historical Graph rounding backtest
        env:
          PYTHONPATH: src
        run: python scripts/run_benchmark_008_graph_rounding.py
