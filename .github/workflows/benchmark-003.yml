name: CYDRA Benchmark 003

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark-003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        working-directory: benchmarks/003_arithmetic_rounding/foundry
        run: forge install foundry-rs/forge-std --no-commit
      - name: Install CYDRA and pytest
        run: python -m pip install -e . pytest
      - name: Python acceptance suite
        run: pytest -q
      - name: Execute arithmetic fixture differential
        working-directory: benchmarks/003_arithmetic_rounding/foundry
        run: forge test -vv
      - name: Execute CYDRA Benchmark 003 prediction test
        env:
          PYTHONPATH: src
        run: python scripts/run_benchmark_003.py
