name: CYDRA Web2 focused regression

on:
  pull_request:
    branches:
      - main
    paths:
      - src/cydra/**
      - tests/test_web2_*.py
      - .github/workflows/cydra-web2-regression.yml
  push:
    branches:
      - feature/web2-adapter
      - feature/web2-hypothesis-generation
      - feature/web2-resource-readiness
  workflow_dispatch:

jobs:
  web2-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CYDRA
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CYDRA
        run: python -m pip install -e .
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile Web2 modules
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/cydra
      - name: Run Web2 regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_web2_adapter.py tests/test_adapter_experiment.py tests/test_web2_model.py tests/test_web2_authorization.py tests/test_web2_evidence.py tests/test_web2_cycle.py tests/test_web2_causal.py tests/test_web2_reasoning.py tests/test_web2_replay.py tests/test_web2_discovery.py tests/test_web2_materialization.py tests/test_web2_discovery.py
