name: CYDRA iterative blind control-flow research loop

on:
  pull_request:
    paths:
      - "src/cydra/**"
      - "scripts/run_benchmark_027_iterative_blind_control_flow.py"
      - "scripts/run_benchmark_005_blind.py"
      - "scripts/run_benchmark_021_unfamiliar_control_flow.py"
      - "benchmarks/027_iterative_blind_control_flow/**"
      - ".github/workflows/benchmark-027-iterative-blind-control-flow.yml"
  workflow_dispatch:

jobs:
  iterative-blind-control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -e . pytest
      - run: pytest -q tests
      - run: PYTHONPATH=src python scripts/run_benchmark_027_iterative_blind_control_flow.py --output backtest-artifacts/iterative-blind-control-flow
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-027-iterative-blind-control-flow
          path: backtest-artifacts/iterative-blind-control-flow/
