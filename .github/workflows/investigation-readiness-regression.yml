name: CYDRA investigation readiness regression

on:
  push:
    branches:
      - feat/investigation-readiness-2026-09-15
  pull_request:
    branches:
      - feat/next-reasoning-hardening-2026-09-15
      - feat/investigation-readiness-2026-09-15

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CYDRA and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run readiness and planning regressions
        run: python -m pytest -q tests/test_investigation_readiness.py tests/test_investigation_readiness_model.py tests/test_information_gain_planner.py
