name: CYDRA Unfamiliar Web3 Authorization Gate

on:
  push:
    branches:
      - feat/unfamiliar-auth-target-gate-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unfamiliar-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out CYDRA
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install CYDRA and test dependencies
        run: python -m pip install -e . pytest

      - name: Run focused authorization regressions
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_blind_authorization.py \
            tests/test_authorization_reasoning.py \
            tests/test_authorization_invariant.py \
            tests/test_blind_auth_campaign_report.py

      - name: Record target authorization and immutable source revision
        run: |
          {
            echo "Program: https://immunefi.com/bug-bounty/immunefi/scope/"
            echo "Program resources: https://immunefi.com/bug-bounty/immunefi/resources/"
            echo "Target repository: https://github.com/immunefi-team/vaults-splitter"
            echo "Target commit: 6f64c3f0557967eee9b14482ffa62187101c79ef"
            echo "Target path: src/Splitter.sol"
            echo "Test mode: local source/model/harness only; no production or public-testnet transactions"
            echo "Scope note: this repository is linked from the program resources; confirm the exact deployed asset and current eligibility before any report."
          } | tee "$RUNNER_TEMP/target-intake.txt"

      - name: Blind unfamiliar target authorization campaign
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_benchmark_006_blind_auth.py \
            --target-repo https://github.com/immunefi-team/vaults-splitter.git \
            --target-ref 6f64c3f0557967eee9b14482ffa62187101c79ef \
            --target-path src/Splitter.sol \
            --target-project . \
            --allow-no-hypothesis \
            --output "$RUNNER_TEMP/unfamiliar-authorization.json" \
            2>&1 | tee "$RUNNER_TEMP/unfamiliar-authorization.log"

      - name: Blind second unfamiliar in-scope authorization target
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          {
            echo "Program: https://immunefi.com/bug-bounty/openzeppelin/scope/"
            echo "Target repository: https://github.com/OpenZeppelin/openzeppelin-community-contracts"
            echo "Target commit: 0361935dc5edd233adbb9fbae5871ccbb8c739d8"
            echo "Target path: contracts/crosschain/axelar/AxelarGatewayAdapter.sol"
            echo "Scope note: this exact commit is explicitly listed by the program as in scope; local-only source/model/harness test."
          } | tee "$RUNNER_TEMP/second-target-intake.txt"
          python scripts/run_benchmark_006_blind_auth.py \
            --target-repo https://github.com/OpenZeppelin/openzeppelin-community-contracts.git \
            --target-ref 0361935dc5edd233adbb9fbae5871ccbb8c739d8 \
            --target-path contracts/crosschain/axelar/AxelarGatewayAdapter.sol \
            --target-project . \
            --allow-no-hypothesis \
            --output "$RUNNER_TEMP/second-unfamiliar-authorization.json" \
            2>&1 | tee "$RUNNER_TEMP/second-unfamiliar-authorization.log"

      - name: Preserve campaign evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-unfamiliar-web3-authorization
          path: |
            ${{ runner.temp }}/target-intake.txt
            ${{ runner.temp }}/unfamiliar-authorization.json
            ${{ runner.temp }}/unfamiliar-authorization.log
            ${{ runner.temp }}/second-target-intake.txt
            ${{ runner.temp }}/second-unfamiliar-authorization.json
            ${{ runner.temp }}/second-unfamiliar-authorization.log
          if-no-files-found: warn
          retention-days: 14
