name: CYDRA Benchmark 001 Negative Control

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark-001-negative-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        working-directory: benchmarks/alchemix_missing_access_control/foundry
        run: forge install foundry-rs/forge-std --no-commit
      - name: Install CYDRA and pytest
        run: python -m pip install -e . pytest
      - name: Python acceptance suite
        run: pytest -q
      - name: Execute safe authorization negative control
        env:
          PYTHONPATH: src
        run: python scripts/run_benchmark_001_negative_control.py
