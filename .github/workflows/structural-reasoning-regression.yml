name: CYDRA structural reasoning regression

on:
  pull_request:
    paths:
      - "src/cydra/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/structural-reasoning-regression.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pytest -q
