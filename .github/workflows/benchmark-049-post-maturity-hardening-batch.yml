name: CYDRA post-maturity hardening batch campaign

on:
  workflow_dispatch:

permissions:

jobs:
  hardening-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CYDRA and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Focused regression
        run: python -m pytest -q tests/test_research_loop.py tests/test_impact_priority.py
      - name: Post-maturity hardening batch
        run: PYTHONPATH=src python scripts/run_benchmark_049_post_maturity_hardening_batch.py
