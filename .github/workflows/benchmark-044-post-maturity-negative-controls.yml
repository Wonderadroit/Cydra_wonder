name: CYDRA Benchmark 044 — Post-Maturity Negative Controls

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_benchmark_044_negative_controls.py"
      - "benchmarks/044_post_maturity_negative_controls/**"
      - ".github/workflows/benchmark-044-post-maturity-negative-controls.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install CYDRA
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Regression
        run: python -m pytest -q
      - name: Negative-control campaign
        env:
          PYTHONPATH: .
        run: python scripts/run_benchmark_044_negative_controls.py
