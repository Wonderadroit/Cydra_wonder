name: Benchmark 033 strict blind read-only reentrancy

on:
  workflow_dispatch:

jobs:
  benchmark-033:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Python dependencies
        run: pip install -e . pytest
      - name: Run structural regression
        run: pytest -q tests/test_read_only_reentrancy.py
      - name: Run strict blind campaign
        run: python scripts/run_benchmark_033_strict_blind_readonly_bond.py
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-033-strict-blind-readonly-bond
          path: backtest-artifacts/strict-blind-readonly-bond
