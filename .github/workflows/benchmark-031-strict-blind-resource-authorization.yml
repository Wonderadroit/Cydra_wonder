name: Benchmark 031 strict blind resource authorization

on:
  workflow_dispatch:

permissions:

jobs:
  benchmark-031:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Python dependencies
        run: pip install -e . pytest
      - name: Run structural regression
        run: pytest -q tests/test_structural_resource_authorization.py
      - name: Run strict blind campaign
        run: python scripts/run_benchmark_031_strict_blind_resource_authorization.py
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-031-strict-blind-resource-authorization
          path: backtest-artifacts/strict-blind-resource-authorization/
