name: CYDRA canonical live-target dogfood

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/canonical-live-dogfood

concurrency:
  group: cydra-live-bounty-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hinkal:
    name: CYDRA → pinned Hinkal bounty target
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CYDRA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install CYDRA
        run: |
          python -m pip install -e .
      - name: Checkout public bounty source
        uses: actions/checkout@v4
        with:
          repository: Hinkal-Protocol/Hinkal-Contracts-Circuits
          ref: 61b6839aa80fc0c33bfdcde0323753c83cb2ce67
          fetch-depth: 0
          submodules: recursive
          path: .cydra-live-target
      - name: Verify target freeze
        run: |
          test "$(git -C .cydra-live-target rev-parse HEAD)" = "61b6839aa80fc0c33bfdcde0323753c83cb2ce67"
          test -z "$(git -C .cydra-live-target status --porcelain)"
      - name: Run CYDRA against the complete in-scope surface
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_live_contest.py \
            --target-spec targets/live-contest.json \
            --target-checkout .cydra-live-target \
            --output live-artifacts
      - name: Publish live research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-live-hinkal-${{ github.sha }}
          path: live-artifacts/
          if-no-files-found: error
          retention-days: 30