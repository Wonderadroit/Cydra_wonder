name: CYDRA canonical live-target dogfood

on:
  workflow_dispatch:

concurrency:
  group: cydra-live-bounty-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hinkal:
    name: CYDRA → pinned Hinkal bounty target
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CYDRA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install CYDRA
        run: |
          python -m pip install -e .
      - name: Install regression tooling
        run: |
          python -m pip install pytest
      - name: Prepare live artifact directory
        run: |
          mkdir -p live-artifacts
      - name: Run generic regression suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest
      - name: Checkout public bounty source
        uses: actions/checkout@v4
        with:
          repository: Hinkal-Protocol/Hinkal-Contracts-Circuits
          ref: 61b6839aa80fc0c33bfdcde0323753c83cb2ce67
          fetch-depth: 0
          submodules: recursive
          path: .cydra-live-target
      - name: Verify target freeze
        run: |
          test "$(git -C .cydra-live-target rev-parse HEAD)" = "61b6839aa80fc0c33bfdcde0323753c83cb2ce67"
          test -z "$(git -C .cydra-live-target status --porcelain)"
      - name: Run CYDRA against the complete in-scope surface
        env:
          PYTHONPATH: src
          CYDRA_LLM_PROVIDER: ${{ vars.CYDRA_LLM_PROVIDER || 'openai' }}
          CYDRA_LLM_API_KEY: ${{ secrets.CYDRA_LLM_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_llm_repair_campaign.py
      - name: Publish live research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-live-hinkal-${{ github.sha }}
          path: live-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Checkpoint live dogfood state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          python scripts/update_live_dogfood_state.py