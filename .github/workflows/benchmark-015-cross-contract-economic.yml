name: benchmark-015-cross-contract-economic
on:
  workflow_dispatch:


jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -e . pytest
      - run: pytest -q tests/test_benchmark_015_blind_gap.py tests/test_benchmark_015_cross_contract_economic.py
      - run: PYTHONPATH=src python scripts/run_benchmark_015_cross_contract_economic.py
