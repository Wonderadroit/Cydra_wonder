name: CYDRA unfamiliar control-flow progress backtest

on:
  workflow_dispatch:


jobs:
  control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_structural_control_flow.py
      - run: PYTHONPATH=src python scripts/run_benchmark_021_unfamiliar_control_flow.py --output backtest-artifacts/control-flow
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-021-control-flow
          path: backtest-artifacts/control-flow/
