name: Benchmark 039 strict blind unbounded liquidation

on:
  workflow_dispatch:


jobs:
  benchmark-039:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CYDRA
        run: python -m pip install -e .
      - name: Install pytest
        run: python -m pip install pytest
      - name: Regression
        run: python -m pytest -q tests/test_structural_unbounded_iteration.py
      - name: Blind target investigation
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_benchmark_039_unbounded_liquidation.py             --output backtest-artifacts/benchmark-039
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-039-unbounded-liquidation
          path: backtest-artifacts/benchmark-039/
