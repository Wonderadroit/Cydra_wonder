name: CYDRA authorized Aurory live discovery

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Relative seed path on app.aurory.io"
        required: true
        default: "/"
      max_paths:
        description: "Maximum read-only discovery paths (1-150)"
        required: true
        default: "150"
      require_authenticated:
        description: "Require the supplied browser-authenticated session"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  live-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out CYDRA
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CYDRA
        uses: actions/checkout@v4
        with:
          path: _unused_checkout

      - name: Install CYDRA package
        run: python -m pip install -e .

      - name: Run bounded authorized discovery
        env:
          AURORY_BUG_BOUNTY_USERNAME: cyberwonder
          CYDRA_WEB2_SESSION_B64: ${{ secrets.CYDRA_WEB2_SESSION_B64 }}
        run: |
          if [ "${{ inputs.require_authenticated }}" = "true" ]; then
            AUTH_FLAG="--require-authenticated"
          else
            AUTH_FLAG=""
          fi
          python scripts/aurory_live_discovery.py \
            --seed "${{ inputs.seed || '/' }}" \
            --max-paths "${{ inputs.max_paths || '150' }}" \
            $AUTH_FLAG

      - name: Publish sanitized discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurory-live-discovery
          path: artifacts/aurory-discovery.json
          if-no-files-found: error
