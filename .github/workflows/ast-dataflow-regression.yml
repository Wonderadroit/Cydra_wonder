name: CYDRA AST dataflow regression

on:
  pull_request:
    paths:
      - "src/cydra/ast_dataflow.py"
      - "tests/test_ast_dataflow_semantics.py"
      - "src/cydra/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  ast-dataflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_ast_dataflow_semantics.py

  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q
